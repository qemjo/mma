name: Mise a jour quotidienne

on:
  schedule:
       # 03h30 UTC vise, mais GitHub retarde les taches planifiees
    # d'environ 4h30 : on obtient donc 8h UTC en pratique, soit
    # 10h en France l'ete et 9h l'hiver.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les bibliotheques
        run: pip install requests beautifulsoup4

      - name: Recuperer les combats sur Sherdog
        run: python mma_tracker.py

      - name: Fabriquer la page
        run: python generer_site.py

      - name: Publier les changements
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html combats.json resultats.json annulations.json fighters.json infos.json
          git add robots.txt sitemap.xml manifest.webmanifest sw.js
          git add -A agenda
          if git diff --staged --quiet; then
            echo "Aucun changement aujourd'hui."
          else
            git commit -m "Mise a jour automatique du $(date +'%d/%m/%Y')"
            git push
          fi
