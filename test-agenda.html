<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test agenda</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0a0a0c; color: #f5f5f7;
         padding: 1.5rem; line-height: 1.5; }
  button, a.btn { display: block; width: 100%; margin: 0 0 1.2rem; padding: 0.9rem 1rem;
      border: none; border-radius: 12px; background: #f2c14e; color: #14140f;
      text-decoration: none; font-weight: 600; font-size: 1rem; text-align: left; }
  small { display: block; color: #4a4a40; font-weight: 400; margin-top: 0.2rem; }
  #etat { color: #9a9aa4; }
</style>
</head>
<body>
<h1>Test Android : ajout par adresse</h1>
<p>Calendrier de test : Anthony Morel.</p>

<button id="test">
  Copier l'adresse et ouvrir Google Agenda
  <small>Ensuite : colle l'adresse dans « URL de l'agenda », puis « Ajouter l'agenda »</small>
</button>
<p id="etat"></p>

<script>
var ADRESSE = "https://mmaradar.fr/agenda/combattants/anthony-morel.ics";
var PAGE = "intent://calendar.google.com/calendar/u/0/r/settings/addbyurl"
         + "#Intent;scheme=https;package=com.android.chrome;"
         + "S.browser_fallback_url=" + encodeURIComponent(
             "https://calendar.google.com/calendar/u/0/r/settings/addbyurl") + ";end";
document.getElementById("test").addEventListener("click", function () {
  function ouvrir() { window.location.href = PAGE; }
  function secours() {
    var t = document.createElement("textarea");
    t.value = ADRESSE; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(t); ouvrir();
  }
  document.getElementById("etat").textContent = "Adresse copiée, ouverture de Google Agenda…";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ADRESSE).then(ouvrir, secours);
  } else { secours(); }
});
</script>
</body>
</html>
